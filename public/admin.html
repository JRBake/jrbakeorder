<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin - Standing Orders</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
  <style>
    .admin-card {
      background: #fff;
      padding: 25px;
      border-radius: 8px;
      border: 1px solid #e0e0e0;
      margin-top: 20px;
    }
    .status-badge {
      font-size: 0.85em;
      padding: 4px 8px;
      border-radius: 4px;
      background: #eee;
      display: inline-block;
      margin-top: 5px;
    }
    .detail-row {
      margin: 8px 0;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1 style="text-align: center; color: #8b5e3c;">Standing Orders Portal</h1>

    <!-- LOGIN FORM -->
    <div id="loginSection" class="admin-card">
      <h2>Admin Authentication</h2>
      <label>
        Password:
        <input type="password" id="adminPassword" placeholder="Enter admin password" />
      </label>
      <button id="loginBtn" style="padding: 12px; margin-top: 10px;">Login</button>
      <p id="loginError" style="color: #c62828; display: none; margin-top: 10px;">Invalid password.</p>
    </div>

    <!-- CONTROL PANEL -->
    <div id="portalSection" class="hidden">
      <div class="admin-card">
        <h2>Select Customer</h2>
        <label>
          Standing Order Customer:
          <select id="customerSelect">
            <option value="">-- Loading customers... --</option>
          </select>
        </label>

        <!-- CUSTOMER OVERVIEW -->
        <div id="customerDetails" class="hidden" style="margin-top: 20px; padding-top: 15px; border-top: 1px solid #eee;">
          <h3 id="custName" style="margin-bottom: 5px;"></h3>
          <div class="status-badge" id="custStatus"></div>

          <div class="detail-row" style="margin-top: 15px;">
            <strong>Email:</strong> <span id="custEmail"></span><br>
            <strong>Phone:</strong> <span id="custPhone"></span><br>
            <strong>Payment Method:</strong> <span id="custPayment"></span><br>
            <strong>Slicing Preference:</strong> <span id="custSlicing"></span><br>
            <strong>Total Amount:</strong> $<span id="custTotal"></span><br>
            <strong>Notes:</strong> <span id="custNotes"></span>
          </div>

          <div style="margin-top: 20px;">
            <label>Pickup Date Line (Optional Override):
              <input type="text" id="pickupDateOverride" placeholder="e.g. This Saturday, Oct 28th" />
            </label>
          </div>

          <button id="sendReceiptBtn" style="padding: 14px; margin-top: 15px; background-color: #2e7d32; color: white;">
            ✉️ Send Receipt
          </button>
        </div>
      </div>

      <div id="adminMessage" class="hidden" style="margin-top: 15px; padding: 15px; border-radius: 5px;"></div>
    </div>
  </div>

  <script src="admin.js"></script>
</body>
</html>
